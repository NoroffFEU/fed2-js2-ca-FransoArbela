<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" crossorigin src="https://kit.fontawesome.com/553a084866.js"></script>
    <script type="module" crossorigin src="/fed2-js2-ca-FransoArbela/assets/main-VRu5ClId.js"></script>
    <script type="module" crossorigin src="https://kit.fontawesome.com/553a084866.js"></script>
    <link rel="stylesheet" crossorigin href="/fed2-js2-ca-FransoArbela/assets/main-BOyjlBAW.css">
  </head>
  <body>
    <main>
      <form name="createPost" id="create-post">
        <h2>Create Post</h2>
        <label for="post-title">Title</label>
        <input
          type="text"
          id="post-title"
          name="title"
          placeholder="Title"
          required
        />

        <label for="post-body">Body</label>
        <textarea
          id="post-body"
          name="body"
          placeholder="Body"
          required
        ></textarea>

        <label for="post-tags">Tags</label>
        <input
          type="text"
          id="post-tags"
          name="tags"
          placeholder="tag1, tag2, tag3"
          required
        />

        <label for="media-url">Media URL</label>
        <input
          type="url"
          id="media-url"
          name="mediaUrl"
          placeholder="https://..."
          required
        />

        <label for="media-alt">Media Alt Text</label>
        <input
          type="text"
          id="media-alt"
          name="mediaAlt"
          placeholder="Describe the image..."
          required
        />

        <button id="submit" type="submit">Create Post</button>
      </form>
    </main>
  </body>
</html>
