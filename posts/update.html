<main>

  <form name="edit-post" id="edit-post">
    <h2>Edit Post</h2>
    <label for="post-title">Title</label>
    <input type="text" id="post-title" placeholder="Title" required />
      
    <label for="post-body">Body</label>
    <textarea id="post-body" placeholder="Body" required></textarea>
      
    <label for="post-tags">Tags</label>
    <input type="text" id="post-tags" placeholder="tag1, tag2, tag3" required />
      
    <label for="media-url">Media URL</label>
    <input type="url" id="media-url" placeholder="https://..." required />
      
    <label for="media-alt">Media Alt Text</label>
    <input type="text" id="media-alt" placeholder="Describe the image..." required />
  
    <button type="submit">Update Post</button>
  </form>
</main>
