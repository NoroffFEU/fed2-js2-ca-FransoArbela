<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" crossorigin src="https://kit.fontawesome.com/553a084866.js"></script>
    <script type="module" crossorigin src="/fed2-js2-ca-FransoArbela/assets/main-CcqVSLlx.js"></script>
    <script type="module" crossorigin src="https://kit.fontawesome.com/553a084866.js"></script>
    <link rel="stylesheet" crossorigin href="/fed2-js2-ca-FransoArbela/assets/main-BOyjlBAW.css">
  </head>

  <body>
    <main>
      <!--  -->
      <div class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8">
        <div class="sm:mx-auto sm:w-full sm:max-w-sm">
          <img
            class="mx-auto h-10 w-auto"
            src="/fed2-js2-ca-FransoArbela/assets/noroff-logo-cWZQt9D6.png"
            alt="Noroff Logo"
          />
          <h2
            class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-gray-900"
          >
            Register new account
          </h2>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
          <form name="register" class="space-y-6">
            <!-- username -->
            <div>
              <label
                for="name"
                class="block text-sm/6 font-medium text-gray-900"
                >name</label
              >
              <div class="mt-2">
                <input
                  name="name"
                  type="name"

                  placeholder="name"
                  required
                  class="form-control block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>
            <!-- bio -->
            <div>
              <label for="bio" class="block text-sm/6 font-medium text-gray-900"
                >Bio</label
              >
              <div class="mt-2">
                <input
                  name="bio"
                  type="bio"
                  placeholder="bio"
                  class="form-control block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>
            <!-- banner -->
            <div>
              <label
                for="banner"
                class="block text-sm/6 font-medium text-gray-900"
                >Banner</label
              >
              <div class="mt-2">
                <input
                  name="banner"
                  type="banner"
                  placeholder="banner"
                  class="form-control block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>
            <!-- avatar -->
            <div>
              <label
                for="avatar"
                class="block text-sm/6 font-medium text-gray-900"
                >Avatar</label
              >
              <div class="mt-2">
                <input
                  name="avatar"
                  type="avatar"
                  placeholder="avatar"
                  class="form-control block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>
            <!-- email -->
            <div>
              <label
                for="email"
                class="block text-sm/6 font-medium text-gray-900"
                >Email address</label
              >
              <div class="mt-2">
                <input
                  name="email"
                  type="email"
                  placeholder="name@example.com"
                  required
                  class="form-control block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>
            <!-- password -->
            <div>
              <div class="flex items-center justify-between">
                <label
                  for="password"
                  class="block text-sm/6 font-medium text-gray-900"
                  >Password</label
                >
              </div>
              <div class="mt-2">
                <input
                  name="password"
                  type="password"
                  placeholder="password"
                  aria-describedby="passwordHelpBlock"
                  required
                  class="form-control block w-full rounded-md bg-white px-3 py-1.5 text-base text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 sm:text-sm/6"
                />
              </div>
            </div>
            <!--  -->
            <div>
              <button
                type="submit"
                class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5 text-sm/6 font-semibold text-white shadow-xs hover:bg-indigo-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
              >
                Register
              </button>
            </div>
          </form>

          <p class="mt-10 text-center text-sm/6 text-gray-500">
            Already have an account?
            <a
              href="login.html"
              class="font-semibold text-indigo-600 hover:text-indigo-500"
              >Log in here</a
            >
          </p>
        </div>
      </div>
    </main>
    <footer>
      <p>&copy; 2021 Noroff</p>
    </footer>
  </body>
</html>
